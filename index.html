<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0f14">
<!-- иконка нарисована кодом: инлайновый SVG, растровых ассетов в игре нет -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171a22'/%3E%3Crect x='6' y='8' width='20' height='13' rx='2' fill='%234aa3ff'/%3E%3Crect x='11' y='23' width='10' height='2.5' rx='1.2' fill='%238a92a6'/%3E%3C/svg%3E">
<title>Сетап</title>
<style>
:root{
  --bg:#0e0f14; --panel:#171a22; --panel-2:#1e222c; --line:#2a2f3c;
  --ink:#e8ecf5; --dim:#8a92a6;
  --cold:#4aa3ff; --warm:#3ddc8a; --hot:#ff9f3d; --burn:#ff4d4d;
  --coin:#ffd76a; --watt:#7fd8ff; --dust:#b0a179;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{
  position:fixed;inset:0;
  background:var(--bg);color:var(--ink);
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit}

.app{display:flex;flex-direction:column;width:100%;height:100dvh;max-width:1280px;margin:0 auto}

.stage{position:relative;flex:1 1 auto;min-height:0;background:#080910}
#scene{display:block;width:100%;height:100%;cursor:pointer}

.panel{
  flex:0 0 auto;display:flex;flex-direction:column;min-height:0;
  max-height:56dvh;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}

/* ---- HUD ---- */
.hud{padding:8px 11px 9px;border-bottom:1px solid var(--line);flex:0 0 auto}
.hud-top{display:flex;align-items:flex-end;gap:10px}
.money{display:flex;align-items:baseline;gap:6px;flex:1;min-width:0}
.money b{font-size:29px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.money span{color:var(--dim);font-size:13px}
.rates{display:flex;flex-direction:column;align-items:flex-end;color:var(--dim);font-size:12px;
  font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.45}
.rates i{font-style:normal;color:var(--ink);font-weight:600}

.gauges{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.gauge{display:flex;align-items:center;gap:8px}
.gauge>label{font-size:11px;color:var(--dim);width:22px;flex:0 0 auto;text-align:center}
.track{position:relative;flex:1;height:13px;border-radius:7px;background:#11141b;
  overflow:hidden;border:1px solid var(--line)}
.zone{position:absolute;top:0;bottom:0;background:rgba(61,220,138,.14);
  border-left:1px solid rgba(61,220,138,.45);border-right:1px solid rgba(255,159,61,.45)}
.fill{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--cold);
  transition:background .18s linear}
.fill.watt{background:var(--watt)}
.fill.dust{background:var(--dust)}
.gauge>b{font-size:12px;min-width:74px;text-align:right;font-variant-numeric:tabular-nums;
  color:var(--dim);font-weight:600}
.gauge>b.warn{color:var(--burn)}

.acts{display:flex;gap:7px;margin-top:9px}
.acts button{
  flex:1;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;
  padding:9px 8px;font-size:13.5px;font-weight:600;min-height:38px;
}
.acts button:disabled{opacity:.4}
.acts button.on{background:var(--hot);color:#241300;border-color:var(--hot)}
.acts button.alert{border-color:#6b5a3d;color:var(--coin)}

.note{margin-top:8px;font-size:12.5px;color:var(--hot);background:rgba(255,159,61,.09);
  border-radius:8px;padding:5px 8px;display:none}
.note.show{display:block}
.note.bad{color:var(--burn);background:rgba(255,77,77,.1)}

/* ---- tabs ---- */
.tabs{display:flex;gap:5px;padding:8px 8px 0;flex:0 0 auto}
.tabs button{
  flex:1;background:none;border:1px solid transparent;border-radius:9px;
  padding:7px 4px;font-size:13px;font-weight:600;color:var(--dim);min-height:34px}
.tabs button.on{background:var(--panel-2);border-color:var(--line);color:var(--ink)}

/* ---- shop ---- */
.shop{flex:1 1 auto;min-height:0;overflow-y:auto;touch-action:pan-y;
  padding:8px;display:flex;flex-direction:column;gap:6px}
.card{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
  padding:8px 10px;min-height:56px}
.card:disabled{opacity:.55}
.card.can{border-color:#3d6b52;background:linear-gradient(180deg,#1b2a22,#1e222c)}
.card.locked{border-color:#5a4a2e}
.ic{font-size:21px;width:25px;text-align:center;flex:0 0 auto}
.txt{flex:1;min-width:0}
.txt .nm{display:flex;gap:6px;align-items:baseline;min-width:0;overflow:hidden}
.txt .nm b{font-size:14.5px;font-weight:600;white-space:nowrap;flex:0 0 auto}
.txt .nm u{font-size:11.5px;color:var(--dim);text-decoration:none;
  flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt .ef{display:block;font-size:12px;color:var(--dim);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.txt .ef.why{color:var(--hot)}
.pips{display:flex;gap:2.5px;margin-top:5px}
.pips s{width:11px;height:3px;border-radius:2px;background:#2c3140;text-decoration:none}
.pips s.on{background:var(--warm)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto}
.side .cost{font-size:13.5px;font-weight:700;color:var(--coin);font-variant-numeric:tabular-nums;white-space:nowrap}
.side .cost.max{color:var(--dim);font-weight:600}
.side .wt{font-size:11px;color:var(--watt);font-variant-numeric:tabular-nums;white-space:nowrap}
.side .wt.bad{color:var(--burn)}

.foot{display:flex;justify-content:space-between;align-items:center;
  color:var(--dim);font-size:11.5px;padding:6px 4px 2px;gap:8px}
.foot button{background:none;border:none;color:var(--dim);text-decoration:underline;
  padding:5px 3px;font-size:11.5px}

/* ---- modal ---- */
.scrim{position:fixed;inset:0;background:rgba(6,7,11,.72);display:flex;
  align-items:center;justify-content:center;padding:18px;z-index:20}
.modal{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:16px}
.modal h2{margin:0 0 8px;font-size:17px;font-weight:600}
.modal p{margin:0 0 14px;font-size:13.5px;color:var(--dim);line-height:1.45}
.modal .btns{display:flex;gap:8px}
.modal .btns button{flex:1;border:1px solid var(--line);background:var(--panel-2);
  border-radius:9px;padding:10px;font-size:14px;font-weight:600;min-height:42px}
.modal .btns button.danger{border-color:#6a3030;color:var(--burn)}
.rowlist{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.rowlist div{display:flex;justify-content:space-between;font-size:13px;gap:12px}
.rowlist div span{color:var(--dim)}
.rowlist div b{font-variant-numeric:tabular-nums;font-weight:600}

@media (orientation:landscape) and (min-width:640px){
  .app{flex-direction:row}
  .panel{max-height:none;height:100dvh;width:min(392px,40%);
    border-top:none;border-left:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <div class="stage"><canvas id="scene"></canvas></div>
  <div class="panel">
    <div class="hud" id="hud"></div>
    <div class="tabs" id="tabs"></div>
    <div class="shop" id="shop"></div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
